[project]
name = "wp-detect"
version = "0.1.0"
description = "Benign, read-only detection of whether a site runs WordPress and its security-relevant response headers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "hogejun", email = "7918106+hogejun@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
]

[project.scripts]
wp-detect = "wp_detect:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

# Dev tooling so the standalone (public) package can run its own tests.
[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
